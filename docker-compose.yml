services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clinicdb
      POSTGRES_USER: clinicuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinicuser -d clinicdb"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
