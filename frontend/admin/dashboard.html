<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin dashboard | Harbor Medical</title><link rel="stylesheet" href="../assets/css/styles.css"></head><body class="admin-body"><main class="admin-shell"><a href="../index.html">← Public website</a><div style="display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap"><div><p class="eyebrow">STAFF WORKSPACE</p><h1>Appointment overview</h1><p>Protected operational information. Demo data is fictional.</p></div><button class="button" id="logout">Sign out</button></div><section class="stats"><div><strong id="total">—</strong><span>Total appointments</span></div><div><strong id="pending">—</strong><span>Pending requests</span></div><div><strong id="confirmed">—</strong><span>Confirmed</span></div></section><section class="admin-panel"><h2>Appointments</h2><p id="message" role="status">Loading appointments…</p><table><thead><tr><th>Reference</th><th>Patient</th><th>Service</th><th>Date & time</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></section></main><script>const API=window.CLINIC_API_BASE||'http://127.0.0.1:8000/api',token=sessionStorage.getItem('clinic_token');if(!token)location.href='login.html';const headers={'Authorization':'Bearer '+token,'Content-Type':'application/json'};document.querySelector('#logout').onclick=()=>{sessionStorage.removeItem('clinic_token');location.href='login.html'};async function load(){try{const r=await fetch(API+'/admin/appointments',{headers});if(r.status===401||r.status===403){sessionStorage.removeItem('clinic_token');location.href='login.html';return}const data=await r.json();if(!r.ok)throw Error(data.detail||'Could not load appointments');document.querySelector('#total').textContent=data.length;document.querySelector('#pending').textContent=data.filter(x=>x.status==='pending').length;document.querySelector('#confirmed').textContent=data.filter(x=>x.status==='confirmed').length;document.querySelector('#message').textContent=data.length?'':'No appointments yet.';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));document.querySelector('#rows').innerHTML=data.map(a=>`<tr><td>${a.id}</td><td>${esc(a.patient_name)}</td><td>${esc(a.service_name)}</td><td>${esc(a.appointment_date)} ${esc(a.appointment_time)}</td><td>${esc(a.status)}</td><td><select data-status="${a.id}" aria-label="Update appointment ${a.id}"><option ${a.status==='pending'?'selected':''}>pending</option><option ${a.status==='confirmed'?'selected':''}>confirmed</option><option ${a.status==='completed'?'selected':''}>completed</option><option ${a.status==='cancelled'?'selected':''}>cancelled</option><option ${a.status==='no_show'?'selected':''}>no_show</option></select></td></tr>`).join('');document.querySelectorAll('[data-status]').forEach(el=>el.onchange=async()=>{try{const rr=await fetch(API+'/admin/appointments/'+el.dataset.status,{method:'PATCH',headers,body:JSON.stringify({status:el.value})});const dd=await rr.json();if(!rr.ok)throw Error(dd.detail||'Update failed');load()}catch(e){alert(e.message);load()}})}catch(e){document.querySelector('#message').textContent=e.message}}load();</script></body></html>
