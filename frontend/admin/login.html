<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff login | Harbor Medical</title><link rel="stylesheet" href="../assets/css/styles.css"></head><body class="admin-body"><main class="admin-shell"><a href="../index.html">← Public website</a><h1>Staff sign in</h1><p>Authorized clinic personnel only.</p><form id="login" class="form-card" style="max-width:440px"><label>Email<input name="email" type="email" required autocomplete="username"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button class="button button-full">Sign in</button><p id="message" role="status"></p></form></main><script>const API=window.CLINIC_API_BASE||'http://127.0.0.1:8000/api';document.querySelector('#login').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.target),m=document.querySelector('#message');try{const r=await fetch(API+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:f.get('email'),password:f.get('password')})});const d=await r.json();if(!r.ok)throw Error(d.detail||'Login failed');sessionStorage.setItem('clinic_token',d.access_token);location.href='dashboard.html';}catch(err){m.textContent=err.message;}});</script></body></html>
